<html>
<head>
    <title>Demo using M2D2 : Storage Extension</title>
    <meta name="HandheldFriendly" content="1">
    <meta name="viewport" content="width=device-width, maximum-scale=1.0">
    <meta name="theme-color" content="#333333">
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../css/examples.css" type="text/css" />
    <link rel="stylesheet" href="../css/demo.css" type="text/css" />
    <!-- form/button/list styles: see demo.css -->
    <script src="../../dist/m2d2.min.js" type="text/javascript"></script>
    <script type="text/javascript">
        m2d2.ready($ => {
            // Storage extension demo. Uses $.session (sessionStorage) to store
            // key/value pairs. Click a key to display its value.
            //
            // Note: we bind the Save button's onclick directly (not onsubmit)
            // because form submission inside the playground iframe navigates
            // away before the handler runs.

            const $stored = $("#stored", {
                template: { li: { /* per-row in refresh() */ } },
                items: []
            });

            const $item = $("#item", "");

            function refresh() {
                $("#key").value = "";
                $("#val").value = "";
                $item.text = "";
                $stored.items.clear();
                $.session.keys().forEach(k => {
                    $stored.items.push({
                        text: k,
                        onclick: function () {
                            const val = $.session.get(this.text);
                            $item.text = JSON.stringify(val);
                        }
                    });
                });
            }

            $("#saveBtn", {
                onclick: function () {
                    const key = $("#key").value.trim();
                    const val = $("#val").value.trim();
                    if (key && val) {
                        $.session.set(key, val);
                        refresh();
                    }
                    return false;
                }
            });

            $("#clearBtn", {
                onclick: function () {
                    $.session.clear();
                    refresh();
                    return false;
                }
            });

            // Seed some demo data and render:
            $.session.set("number", 100);
            $.session.set("object", { some: "value" });
            $.session.set("array", ["a", "b", "c"]);
            refresh();
        });
    </script>
</head>
<body>
<article>
    <h3>Input:</h3>
    <form id="keep" onsubmit="return false;">
        <div>
            <label>Keyword</label><input type="text" id="key" name="key" required />
        </div>
        <div>
            <label>Value</label><input type="text" id="val" name="val" required />
        </div>
        <div class="right">
            <button id="saveBtn" type="button">Save</button>
            <button id="clearBtn" type="button">Clear</button>
        </div>
    </form>
    <h3>Stored Values:</h3>
    <p>Click on key to show value:</p>
    <ul id="stored">
    </ul>
    <h3>Value:</h3>
    <code id="item"></code>
</article>
</body>
</html>
