<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>M2D2 — Alert Extension Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../css/examples.css" type="text/css" />
<link rel="stylesheet" href="../css/demo.css" type="text/css" />
<!-- All three alert CSS files so the theme switch is instant (no re-fetch): -->
<link rel="stylesheet" href="../../dist/alert.css" type="text/css" />
<link rel="stylesheet" href="../../dist/alert-light.css" type="text/css" />
<link rel="stylesheet" href="../../dist/alert-dark.css" type="text/css" />
<!-- Icon fonts (harmless if the matching source isn't selected). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<style>
    /* Alert demo page — overrides demo.css body to a centered column.
       The control panel + buttons reuse demo.css form/button styles. */
    body { display: flex; flex-direction: column; align-items: stretch; gap: 16px; }
    h1 { font-size: 20px; }
    .controls { display: flex; gap: 16px; flex-wrap: wrap; margin: 8px 0; }
    .controls label { display: flex; flex-direction: column; gap: 4px;
                      font-size: 13px; color: #555; font-weight: 500; }
    .controls select {
        padding: 7px 10px; background: #fff; color: #1a1a2e;
        border: 1px solid #d0d0d8; border-radius: 5px; font-size: 14px;
        font-family: inherit; outline: none; cursor: pointer;
        transition: border-color 0.15s, box-shadow 0.15s;
    }
    .controls select:focus {
        border-color: #5b8def;
        box-shadow: 0 0 0 3px rgba(91, 141, 239, 0.15);
    }
    .buttons { display: flex; gap: 8px; flex-wrap: wrap; }
    /* Changed to improve example experience (not required) */
	.m2d2-alert-back { align-items: baseline !important; padding-top: 60px; }
</style>
<script src="../../dist/m2d2.min.js" type="text/javascript"></script>
<script type="text/javascript">
// Alert extension demo — interactive.
//
// Instead of firing a canned alert sequence on load, this page exposes a
// control panel: choose an icon source + theme, then click a button to fire
// the corresponding alert type. This single file replaces the four old
// alert-*.html variants (default / material / material-dark / fontawesome),
// which differed only in their register() call.
//
// Binding note: every container uses `tagName: "div"` directly with a `css`
// class that matches the item key — that's how m2d2's locate() finds each
// child. Do NOT use the `{ div: { ... } }` wrapping form; it doesn't create
// a named child and the inner spec is silently dropped.

m2d2.ready($ => {
    // Apply initial config. The selects below call register() again on change,
    // so the user can switch icon source / theme live.
    m2d2.alert.register({ icons: "default", theme: "light" });

    $("#panel", {
        h1: "Alert Extension",
        note: { tagName: "p", css: "note", text: "Pick an icon source and theme, then click a button. Material / Font Awesome require their fonts (loaded already for this example)." },
        controls: {
            tagName: "div",
            css: "controls",
            iconLabel: {
                tagName: "label",
                text: "Icon source",
                sel: {
                    tagName: "select",
                    onchange: function () { m2d2.alert.register({ icons: this.value }); },
                    option1: { tagName: "option", value: "default",  text: "Unicode (default)" },
                    option2: { tagName: "option", value: "material", text: "Material Symbols" },
                    option3: { tagName: "option", value: "fa",       text: "Font Awesome" },
                    option4: { tagName: "option", value: "svg",      text: "SVG" }
                }
            },
            themeLabel: {
                tagName: "label",
                text: "Theme",
                sel: {
                    tagName: "select",
                    onchange: function () { m2d2.alert.register({ theme: this.value }); },
                    option1: { tagName: "option", value: "light", text: "Light" },
                    option2: { tagName: "option", value: "dark",  text: "Dark" }
                }
            }
        },
        buttons: {
            tagName: "div",
            css: "buttons",
            wait:    { tagName: "button", text: "$.wait",    onclick: () => { $.wait("Please wait..."); setTimeout(() => $.closeAll(), 3000); } },
            alert:   { tagName: "button", text: "$.alert",   onclick: () => $.alert("Heads up", "This is an informational alert.") },
            success: { tagName: "button", text: "$.success", onclick: () => $.success("Saved!", "Your changes were stored.") },
            failure: { tagName: "button", text: "$.failure", onclick: () => $.failure("Something went wrong", "Please try again.") },
            confirm: { tagName: "button", text: "$.confirm", onclick: () => $.confirm("Are you sure?", "This cannot be undone.", r => $.alert("You chose: " + r)) },
            prompt:  { tagName: "button", text: "$.prompt",  onclick: () => $.prompt("What is your name?", r => $.alert("Hello, " + r)) },
            //close:   { tagName: "button", text: "$.closeAll", css: "close", onclick: () => $.closeAll() }
        },
    });
});
</script>
</head>
<body>
<div id="panel"></div>
</body>
</html>
