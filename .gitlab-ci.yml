# GitLab CI for the m2d2 TypeScript rewrite.
# Toolchain: Vitest + jsdom (tests), esbuild (bundling), tsc (types/typecheck).
# No browser, no Karma, no Gulp.

stages:
  - test
  - build

# Run unit tests (Vitest + jsdom). No browser binary required.
test:
  stage: test
  image: node:20-alpine
  script:
    - npm ci
    - npm test
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/

# Build the distributables (esbuild ESM/CJS/IIFE + CSS + .d.ts) and typecheck.
build:
  stage: build
  image: node:20-alpine
  script:
    - npm ci
    - npm run typecheck
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
